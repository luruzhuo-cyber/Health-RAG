<!doctype html><html lang="zh"><meta charset="utf-8"><title>健康档案检索演示</title><style>body{font:18px system-ui;max-width:850px;margin:60px auto;background:#eef4f3;color:#173b37}textarea{width:100%;height:80px}button{padding:10px}pre{white-space:pre-wrap;background:white;padding:20px}</style><h1>健康档案问答</h1><p>本地学习演示。问题必须写明一位档案患者姓名。结果仅用于资料检索学习。</p><textarea id="q" placeholder="请输入档案中的患者姓名和问题"></textarea><p><button id="go">检索并回答</button></p><pre id="out">等待提问</pre><script>go.onclick=async()=>{out.textContent='处理中';try{const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:q.value}],mode:'hybrid',rerank:true})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='服务连接失败'}}</script></html>
